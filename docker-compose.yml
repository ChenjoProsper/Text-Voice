services:
  vocelibre:
    build: .
    container_name: Text-Voice_app
    ports:
      - "5000:5000"
    environment:
      TTS_CONCURRENCE: "2"     # mettre "1" si le service vocal vous limite
    volumes:
      - ./documents:/app/documents
      - ./static/audio:/app/static/audio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

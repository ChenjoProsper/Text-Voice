<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>VoceLibre - Convertisseur PDF vers Audio</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h1>🔊 VoceLibre</h1>
        <p>Transformez vos documents PDF en fichiers audio instantanément.</p>
        
        <form action="/convertir" method="POST" enctype="multipart/form-data" style="margin-top: 30px;">
            <input type="file" name="fichier_pdf" accept=".pdf" required>
            <br><br>
            <button type="submit" style="padding: 10px 20px; font-size: 16px;">Convertir en Audio</button>
        </form>
    </div>
</body>
</html>
